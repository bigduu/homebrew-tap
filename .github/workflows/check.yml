name: Check tap

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  update-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node --test scripts/*.test.cjs
  audit:
    uses: ./.github/workflows/check-tap.yml
    with:
      ref: ${{ github.sha }}
