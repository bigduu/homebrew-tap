name: Check candidate tap

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to audit
        required: true
        type: string
      snapshot_artifact:
        description: Prepared tap update snapshot from this workflow run
        default: ''
        type: string

permissions:
  contents: read

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Require the expected native test architecture
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner == 'macos-15' && 'ARM64' || 'X64' }}
          ACTUAL_RUNNER_ARCH: ${{ runner.arch }}
        run: test "$ACTUAL_RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        if: inputs.snapshot_artifact != ''
        with:
          name: ${{ inputs.snapshot_artifact }}
          path: ${{ runner.temp }}/tap-snapshot
      - name: Verify prepared candidate before running Homebrew
        if: inputs.snapshot_artifact != ''
        run: node scripts/tap-update.cjs verify "$RUNNER_TEMP/tap-snapshot/snapshot.json"
      - name: Register checked-out tap
        run: |
          brew tap bigduu/tap "$GITHUB_WORKSPACE"
          brew trust bigduu/tap
      - name: Audit formulae and cask
        run: |
          brew audit --strict --formula bigduu/tap/jiandu bigduu/tap/nova bigduu/tap/magpie
          brew audit --strict --cask bigduu/tap/bodhi
      - name: Fetch and verify release assets
        run: |
          brew fetch --formula bigduu/tap/jiandu bigduu/tap/nova bigduu/tap/magpie
      - name: Fetch and verify ARM Bodhi release
        if: runner.arch == 'ARM64'
        run: brew fetch --cask bigduu/tap/bodhi
      - name: Verify original Bodhi signing before the cask modifies the app
        if: runner.arch == 'ARM64'
        run: |
          mountpoint="$(mktemp -d "$RUNNER_TEMP/bodhi-original.XXXXXX")"
          cleanup() {
            /usr/bin/hdiutil detach "$mountpoint" >/dev/null 2>&1 || true
            rmdir "$mountpoint" 2>/dev/null || true
          }
          trap cleanup EXIT
          dmg="$(brew --cache --cask bigduu/tap/bodhi)"
          test -f "$dmg"
          /usr/bin/hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint"
          node scripts/verify-bodhi-signing.cjs "$mountpoint/Bodhi AI.app"
      - name: Check installation plan
        if: runner.arch == 'ARM64'
        run: brew install --dry-run --cask bigduu/tap/bodhi
      - name: Install formula dependencies in both architectures
        run: brew install --formula bigduu/tap/jiandu bigduu/tap/nova
      - name: Install ARM Bodhi in the disposable runner
        if: runner.arch == 'ARM64'
        run: |
          mkdir -p "$RUNNER_TEMP/bodhi-apps"
          brew install --cask --appdir="$RUNNER_TEMP/bodhi-apps" bigduu/tap/bodhi
          app="$RUNNER_TEMP/bodhi-apps/Bodhi AI.app"
          test -x "$app/Contents/MacOS/bodhi"
          /usr/bin/file "$app/Contents/MacOS/bodhi" | grep -F "$(uname -m)"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app"
          /usr/bin/codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Signature=adhoc'
          /usr/bin/xattr -lr "$app" > "$RUNNER_TEMP/bodhi-xattrs.txt"
          if grep -Fq 'com.apple.quarantine' "$RUNNER_TEMP/bodhi-xattrs.txt"; then
            echo 'Bodhi quarantine attribute remains after postflight signing' >&2
            exit 1
          fi
      - name: Verify Intel rejects the ARM-only Bodhi cask
        if: runner.arch == 'X64'
        run: |
          brew info --json=v2 --cask bigduu/tap/bodhi | jq -e '.casks[0].depends_on.arch == [{"type":"arm","bits":64}]'
          if brew install --cask --appdir="$RUNNER_TEMP/bodhi-unsupported" bigduu/tap/bodhi > "$RUNNER_TEMP/bodhi-unsupported.log" 2>&1; then
            cat "$RUNNER_TEMP/bodhi-unsupported.log"
            echo 'Intel must reject the ARM-only Bodhi cask.' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/bodhi-unsupported.log"
          grep -F 'This cask depends on hardware architecture being one of' "$RUNNER_TEMP/bodhi-unsupported.log"
      - name: Verify formula dependencies in both architectures
        run: |
          test -x "$(brew --prefix)/bin/jiandu"
          test -x "$(brew --prefix)/bin/nova"
          jiandu --help
          nova --version
      - name: Install magpie
        run: |
          brew install --formula bigduu/tap/magpie
          magpie --version
      - name: Verify cask dependencies
        run: |
          brew info --json=v2 --cask bigduu/tap/bodhi | jq -e '.casks[0].depends_on.formula | index("bigduu/tap/jiandu") and index("bigduu/tap/nova")'
